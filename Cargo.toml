[package]
name = "graphics"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
winit = { version = "0.30", features = ["rwh_06", "android-native-activity"] }
wgpu = "30.0"
pollster = "0.3"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["ansi", "env-filter"]}

[profile.dev]
opt-level = 0
debug = true
